name: Pull Request Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job 1: Auto-label PRs based on files changed
  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Label based on changed files
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  # Job 2: Check PR title follows conventional commits
  pr-title-check:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body ?? '';
            const pullNumber = context.payload.pull_request.number;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .{1,100}$/;
            // Allow the PR body summary to satisfy the check when automation generates a human-readable PR title.
            const firstBodyLine = body
              .split('\n')
              .map((line) => line.trim())
              .find(Boolean);
            let docsOnlyChange = false;

            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              let page = 1;
              const perPage = 100;
              let sawAnyFile = false;
              docsOnlyChange = true;

              while (true) {
                const { data: changedFiles } = await github.rest.pulls.listFiles({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: perPage,
                  page,
                });

                if (changedFiles.length === 0) {
                  break;
                }

                sawAnyFile = true;

                if (
                  changedFiles.some(
                    ({ filename }) =>
                      !filename.startsWith('docs/') && !filename.startsWith('.github/agents/')
                  )
                ) {
                  docsOnlyChange = false;
                  break;
                }

                if (changedFiles.length < perPage) {
                  break;
                }

                page += 1;
              }

              docsOnlyChange = docsOnlyChange && sawAnyFile;
            } catch (error) {
              const errorMessage = error instanceof Error ? error.message : String(error);
              core.warning(`Unable to inspect PR files for docs-only title check bypass: ${errorMessage}`);
            }

            if (!pattern.test(title) && !pattern.test(firstBodyLine ?? '') && !docsOnlyChange) {
              core.setFailed(
                '❌ PR title or the first non-empty line of the PR body must follow Conventional Commits format:\n\n' +
                'Examples:\n' +
                '  - feat: add user authentication\n' +
                '  - fix(api): resolve CORS issue\n' +
                '  - docs: update README with setup instructions\n' +
                '  - refactor(components): simplify MediaCard logic\n\n' +
                'Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert'
              );
            } else {
              core.info('✅ PR metadata follows Conventional Commits format');
            }
